services:
  mongo:
    build:
      context: ./mongo
    image: visualsc-mongo:local
    container_name: visualsc-mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visualsc-backend
    environment:
      PORT: "3001"
      DATABASE_URL: "mongodb://mongo:27017/rodson-coffee"
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
